# Tool settings for the backend. Run both tools from this backend/ folder.

[tool.pytest.ini_options]
# pythonpath makes "import app" work, the same way the app is imported on
# Vercel (api/index.py) and by the seed command.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
# "app" lives in this folder, so ruff should sort it as our own code.
src = ["."]
line-length = 100
target-version = "py312"
