# Sends due emails (confirmations, retries, reminders) every 15 minutes.
#
# Why GitHub Actions and not a Vercel cron: on Vercel's free Hobby plan a cron
# job may run at most once per day, so reminders would arrive hours late.
# A scheduled GitHub workflow is free and may run every 5 minutes or more.
# See docs/email.md, section "Scheduler".
#
# Repository secrets to set (Settings > Secrets and variables > Actions):
#   SEATPLAN_URL   the deployed site, e.g. https://seatplan-demo.vercel.app (no trailing slash)
#   CRON_SECRET    the same value as the CRON_SECRET environment variable on Vercel

name: email-cron

on:
  schedule:
    - cron: "*/15 * * * *"
  # Lets a team member press "Run workflow" before a demo.
  workflow_dispatch:

# The job only makes one HTTP call; it needs no access to the repository.
permissions: {}

# If a run is still going when the next one starts, the new one waits for it.
# The endpoint is safe to call twice at once; this just avoids pointless overlap.
concurrency:
  group: email-cron
  cancel-in-progress: false

jobs:
  process-outbox:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call the outbox processing endpoint
        env:
          SEATPLAN_URL: ${{ secrets.SEATPLAN_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SEATPLAN_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SEATPLAN_URL or CRON_SECRET is not set; nothing to do."
            exit 0
          fi
          # --fail: a 401 or 500 makes the run red, so we notice.
          # The secret goes in a header, never in the URL, so it is not logged.
          curl --fail --silent --show-error --max-time 60 \
            --request POST \
            --header "X-Cron-Secret: ${CRON_SECRET}" \
            "${SEATPLAN_URL}/api/internal/email/process"
